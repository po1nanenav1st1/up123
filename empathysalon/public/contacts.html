<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <link rel="stylesheet" href="/public/css/styles.css">
    <script src="/public/js/appointment.js"></script>
</head>

<body>
    <header>
        <div class="header">
            <div class="parts">
                <a href="/public/about.html" class="headerText">О нас</a>
                <a href="/public/services.html" class="headerText">Услуги</a>
            </div>
            <a href="/public/index.html">
                <img src="/public/images/logo.svg" alt="logo" id="logo" width="203.46px">
            </a>
            <div class="parts">
                <a href="/public/contacts.html" class="headerText">Контакты</a>
                <a href="" class="headerText">Записаться</a>
            </div>
        </div>
    </header>
    <main>
    <div class="contacts">
        <p class="headCon">Contacts</p>
        <div class="infomap">
            <div class="info">
                <div class="infopart">
                    <p class="headInP">Телефон</p>
                    <p class="descInP">+7 906 660 66 06</p>
                </div>
                <div class="infopart">
                    <p class="headInP">Email</p>
                    <p class="descInP">empathy_beauty@mail.ru</p>
                </div>
                <div class="infopart">
                    <p class="headInP">Адрес</p>
                    <p class="descInP">г.Оренбург, ул. Чкалова 11</p>
                </div>
                <div class="infopart">
                    <p class="headInP">Режим работы</p>
                    <p class="descInP">Пн-Сб: 10:00 до 19:00, Вс — выходной</p>
                </div>
            </div>
            <div class="map">
                <iframe
                    src="https://yandex.ru/map-widget/v1/?um=constructor%3A1003079b63fe4f1a5ffa5129a48da5ecdf91f4db424c35bdeff4cee3dac5a2b2&amp;source=constructor"
                    width="732px" height="414px" frameborder="0"></iframe>
            </div>
        </div>
    </div>
    <section class="booking-section">
        <div class="booking-container">
            <h2 class="booking-title">Записаться</h2>

            <form id="bookingForm" class="booking-form" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" id="name" name="name" placeholder="Ваше имя" required>
                        <span class="error-msg" id="nameError"></span>
                    </div>
                    <div class="form-group">
                        <input type="tel" id="phone" name="phone" placeholder="Номер телефона" required>
                        <span class="error-msg" id="phoneError"></span>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group select-group">
                        <select id="service" name="service" required>
                            <option value="" disabled selected hidden>Услуга</option>
                            <option value="Макияж">Макияж</option>
                            <option value="Стрижка">Стрижка</option>
                            <option value="Окрашивание">Окрашивание</option>
                            <option value="Маникюр">Маникюр</option>
                        </select>
                        <span class="select-arrow"></span>
                        <span class="error-msg" id="serviceError"></span>
                    </div>

                    <div class="form-group">
                        <input type="date" id="date" name="date" placeholder="Дата посещения" required>
                        <span class="error-msg" id="dateError"></span>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Отправить</button>
            </form>
        </div>
    </section>
</main>
    <footer>
        <div class="header">
            <div class="parts">
                <a href="/public/about.html" class="headerText">О нас</a>
                <a href="/public/services.html" class="headerText">Услуги</a>
            </div>
            <a href="/public/index.html">
                <img src="/public/images/logo.svg" alt="logo" id="logo" width="203.46px">
            </a>
            <div class="parts">
                <a href="/public/contacts.html" class="headerText">Контакты</a>
                <a href="" class="headerText">Записаться</a>
            </div>
        </div>
    </footer>
</body>
<div class="toast-notification" id="successToast">
    <div class="toast-text">Спасибо! Мы свяжемся с вами в ближайшее время.</div>
</div>

</html>
